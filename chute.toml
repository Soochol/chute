# chute 자신의 검증 명령. AGENTS.md의 검사와 같다.
approval = "agent"
require_head = true
preflight = "never"

[[verify]]
name = "fmt"
run = "cargo fmt --check"
timeout = 300

[[verify]]
name = "mod"
run = "node --test mod/*/*.test.js"
timeout = 300
failed = '✖ (.+) \(\d[\d.]*ms\)'

[[verify]]
name = "clippy"
run = "cargo clippy -j 8 --all-targets -- -D warnings"
timeout = 1800

[[verify]]
name = "test"
run = "cargo test -j 8 -- --test-threads=8"
timeout = 1800
failed = 'test (\S+) \.\.\. FAILED'
